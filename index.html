<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Impacto IA - Cuadernillos</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#080d1c;
  color:white;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:25px 18px 50px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-top:15px;
}

.logo span{
  color:#7c5cff;
}

.subtitulo{
  text-align:center;
  color:#aab1c5;
  margin:8px 0 30px;
}

.card{
  background:#151c31;
  border:1px solid #252e4a;
  border-radius:20px;
  padding:22px;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 8px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #303b5c;
  border-radius:12px;
  background:#202942;
  color:white;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#7c5cff;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

#status{
  margin-top:20px;
  text-align:center;
  font-weight:bold;
  min-height:24px;
}

#resultado{
  display:none;
  margin-top:20px;
}

.pagina{
  background:white;
  color:#111;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.pagina h2{
  margin-top:0;
  color:#222;
}

.pagina p{
  line-height:1.55;
}

.dibujo{
  width:100%;
  max-width:500px;
  display:block;
  margin:20px auto 5px;
  border:1px solid #ddd;
  border-radius:10px;
}

.descarga{
  display:none;
  width:100%;
  margin-top:15px;
  padding:15px;
  text-align:center;
  text-decoration:none;
  background:#19a974;
  color:white;
  border-radius:12px;
  font-weight:bold;
}

.precios{
  text-align:center;
  margin-top:25px;
  color:#aab1c5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
Impacto <span>IA</span>
</div>

<div class="subtitulo">
Crea cuadernillos infantiles con inteligencia artificial
</div>

<div class="card">

<label for="tipo">Tipo de cuadernillo</label>

<select id="tipo">
<option value="Actividades infantiles">Actividades infantiles</option>
<option value="Colorear">Colorear</option>
<option value="Matemáticas">Matemáticas</option>
<option value="Lectura">Lectura</option>
<option value="Escritura">Escritura</option>
<option value="Aprendizaje">Aprendizaje</option>
</select>

<label for="tema">Tema</label>

<input
id="tema"
type="text"
placeholder="Ejemplo: animales del bosque"
>

<label for="edad">Edad</label>

<select id="edad">
<option value="3-5 años">3-5 años</option>
<option value="5-7 años">5-7 años</option>
<option value="7-9 años">7-9 años</option>
<option value="9-12 años">9-12 años</option>
</select>

<label for="pag">Número de páginas</label>

<select id="pag">
<option value="20">20 páginas</option>
<option value="30">30 páginas</option>
<option value="40">40 páginas</option>
<option value="50">50 páginas</option>
</select>

<label for="estilo">Estilo</label>

<select id="estilo">
<option value="Divertido">Divertido</option>
<option value="Educativo">Educativo</option>
<option value="Colorido">Colorido</option>
<option value="Profesional">Profesional</option>
</select>

<label for="extra">Instrucciones adicionales</label>

<textarea
id="extra"
placeholder="Ejemplo: actividades fáciles y divertidas..."
></textarea>

<button id="generarBtn" onclick="generar()">
🚀 GENERAR CUADERNILLO
</button>

<div id="status"></div>

<div id="resultado"></div>

<a
id="download"
class="descarga"
href="#"
target="_blank"
>
📥 Descargar cuadernillo
</a>

</div>

<div class="precios">
Gratis · Lite 4,99 €/mes · Pro 9,99 €/mes
</div>

</div>

<script>

async function generar(){

const tema =
document.getElementById("tema").value.trim();

if(!tema){

document.getElementById("status").textContent =
"❌ Escribe un tema";

return;
}

const tipo =
document.getElementById("tipo").value;

const edad =
document.getElementById("edad").value;

const paginas =
document.getElementById("pag").value;

const estilo =
document.getElementById("estilo").value;

const extra =
document.getElementById("extra").value;

const status =
document.getElementById("status");

const resultado =
document.getElementById("resultado");

const boton =
document.getElementById("generarBtn");

const download =
document.getElementById("download");

boton.disabled=true;

status.textContent =
"⏳ Creando cuadernillo e imágenes...";

resultado.style.display="none";

resultado.innerHTML="";

download.style.display="none";

try{

const respuesta = await fetch(
"/api/generar",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
prompt:tema,
tipo:tipo,
tema:tema,
edad:edad,
paginas:paginas,
estilo:estilo,
extra:extra
})
}
);

const textoRespuesta =
await respuesta.text();

let data;

try{

data=JSON.parse(textoRespuesta);

}catch{

throw new Error(
"El servidor devolvió una respuesta incorrecta."
);

}

if(!respuesta.ok){

throw new Error(
data.error || "Error del servidor"
);

}

if(!data.texto){

throw new Error(
"La IA no devolvió contenido"
);

}

resultado.style.display="block";

const paginasTexto =
data.texto.split(/PÁGINA\s+\d+/i);

let numeroPagina=0;

for(const bloque of paginasTexto){

if(!bloque.trim()) continue;

numeroPagina++;

let titulo="";
let actividad="";
let dibujo="";

const tituloMatch =
bloque.match(/TÍTULO:\s*(.*)/i);

if(tituloMatch){
titulo=tituloMatch[1].trim();
}

const actividadMatch =
bloque.match(
/ACTIVIDAD:\s*([\s\S]*?)(?=\nDIBUJO:|$)/i
);

if(actividadMatch){
actividad=actividadMatch[1].trim();
}

const dibujoMatch =
bloque.match(
/DIBUJO:\s*([\s\S]*)/i
);

if(dibujoMatch){
dibujo=dibujoMatch[1].trim();
}

const pagina =
document.createElement("div");

pagina.className="pagina";

pagina.innerHTML=
"<h2>Página "+numeroPagina+"</h2>"+
"<h3>"+escapeHTML(titulo)+"</h3>"+
"<p>"+escapeHTML(actividad).replace(/\n/g,"<br>")+"</p>";

if(
data.imagenes &&
data.imagenes.length >= numeroPagina
){

const imagenData =
data.imagenes[numeroPagina-1];

if(imagenData){

const img =
document.createElement("img");

img.className="dibujo";

if(
imagenData.imagen.startsWith("data:")
){

img.src=imagenData.imagen;

}else if(
imagenData.imagen.startsWith("http")
){

img.src=imagenData.imagen;

}else{

img.src=
"data:image/png;base64,"+
imagenData.imagen;

}

pagina.appendChild(img);

}

}

if(dibujo){

const descripcion =
document.createElement("small");

descripcion.style.display="block";
descripcion.style.color="#777";
descripcion.style.marginTop="10px";

descripcion.textContent =
"Descripción del dibujo: "+dibujo;

pagina.appendChild(descripcion);

}

resultado.appendChild(pagina);

}

status.textContent =
"✅ ¡Cuadernillo creado correctamente!";

}catch(error){

status.textContent =
"❌ "+error.message;

}finally{

boton.disabled=false;

}

}

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
